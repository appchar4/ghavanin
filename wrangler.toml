name = "tax-advisor-worker"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# --- Workers AI (فاز ۲: embedding برای RAG + OCR تصویر) ---
[ai]
binding = "AI"

# --- Vectorize (فاز ۲: جستجوی برداری پایگاه دانش) ---
# فعلاً غیرفعاله چون هنوز ایندکسش ساخته نشده. بعد از ساختنش، این سه خط رو
# از حالت کامنت (#) در بیار.
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "tax-advisor-index"

# --- دیتابیس D1 ---
[[d1_databases]]
binding = "DB"
database_name = "tax-advisor-db"
database_id = "f74bd131-58f6-42a3-9a45-8c98c5faa115"

# --- KV برای سشن‌ها ---
[[kv_namespaces]]
binding = "KV"
id = "ac569c099a914d99b7dd670d4dc1c552"

# --- متغیرهای محیطی عمومی (غیر محرمانه) ---
[vars]
ENVIRONMENT = "production"

# --- Secrets (با دستور wrangler secret put تنظیم شوند، نه اینجا) ---
# wrangler secret put AI_KEY
# wrangler secret put SMS_API_URL   (اختیاری)
# wrangler secret put SMS_API_KEY   (اختیاری)
